<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Mr Mohamed Ayman | منصة الكيمياء</title>
  <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2300cec9'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-weight='bold'%3EMA%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #00cec9; 
      --primary-dark: #00b894;
      --secondary: #81ecec;
      --success: #00b894;
      --danger: #ff7675;
      --dark-bg: #1e272e;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-dark: #2d3436;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      padding-bottom: 30px;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    /* أنيميشن الفقاعات الكيميائية في الخلفية */
    .bubbles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }
    .bubble {
      position: absolute; bottom: -50px;
      background: rgba(0, 206, 201, 0.2);
      border-radius: 50%;
      border: 1px solid rgba(0, 206, 201, 0.5);
      animation: rise infinite ease-in;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }

    /* Header */
    header {
      background: rgba(30, 39, 46, 0.85); backdrop-filter: blur(15px);
      border-bottom: 2px solid var(--primary); padding: 25px 15px;
      border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,206,201,0.2);
      position: relative; text-align: center;
    }
    h1 { font-size: 1.6rem; font-weight: 800; color: white; text-shadow: 0 0 10px var(--primary); }
    .slogan { font-size: 0.85rem; color: var(--secondary); margin-top: 8px; letter-spacing: 1px; }

    /* Containers & Cards */
    .container { max-width: 600px; margin: 30px auto; padding: 0 15px; }
    .card {
      background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 20px;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2); text-align: center;
      font-size: 1.2rem; font-weight: 700; border-right: 5px solid var(--primary);
    }
    .card:active { transform: scale(0.97); }
    .card:hover { box-shadow: 0 10px 25px rgba(0,206,201,0.3); }

    .progress-bar { height: 6px; background: #dfe6e9; border-radius: 10px; overflow: hidden; margin-top: 15px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--primary)); width: 0%; transition: width 0.5s ease-out; }

    /* Session Cards */
    .session-card {
      background: var(--card-bg); border-radius: 18px; padding: 18px; margin-bottom: 15px;
      transition: all 0.3s; border-right: 4px solid #b2bec3;
    }
    .session-card.locked { opacity: 0.9; }
    .session-card.unlocked { border-right-color: var(--success); box-shadow: 0 0 15px rgba(0, 184, 148, 0.2); }

    /* Buttons */
    .action-buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .action-btn {
      flex: 1; min-width: 90px; padding: 12px 8px; border: none; border-radius: 12px;
      font-weight: 700; font-size: 0.85rem; font-family: 'Cairo', sans-serif; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s; color: white;
    }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.video { background: linear-gradient(45deg, #ff7675, #d63031); }
    .action-btn.homework { background: linear-gradient(45deg, #74b9ff, #0984e3); }
    .action-btn.test { background: linear-gradient(45deg, #55efc4, #00b894); }

    .btn { padding: 12px 25px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 700; cursor: pointer; margin: 5px; font-family: 'Cairo', sans-serif; transition: 0.3s; }
    .btn-primary { background: var(--primary); color: var(--dark-bg); box-shadow: 0 4px 15px rgba(0,206,201,0.4); }
    .btn-danger { background: transparent; color: var(--danger); border: 2px solid var(--danger); }
    .back-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); margin-top: 20px; width: 100%; backdrop-filter: blur(5px); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 32, 39, 0.9); backdrop-filter: blur(10px);
      z-index: 1000; display: none; justify-content: center; align-items: center;
    }
    .modal-container {
      background: var(--card-bg); border-radius: 30px; padding: 30px 20px;
      text-align: center; width: 90%; max-width: 380px; max-height: 90vh; overflow-y: auto;
      border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(0,206,201,0.2);
      animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-container::-webkit-scrollbar { width: 5px; }
    .modal-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    @keyframes modalPop { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

    .password-input {
      width: 100%; padding: 15px; font-size: 1.4rem; text-align: center;
      border: 2px solid #dfe6e9; border-radius: 15px; margin: 20px 0;
      font-family: monospace; letter-spacing: 8px; direction: ltr;
      background: rgba(255,255,255,0.9); transition: 0.3s;
    }
    .password-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 10px rgba(0,206,201,0.3); }

    /* تنسيقات قسم الدفع */
    .payment-section {
      background: rgba(0, 206, 201, 0.05); border: 1px dashed var(--primary);
      border-radius: 15px; padding: 15px; margin-top: 15px; text-align: right;
    }
    .payment-title { color: var(--dark-bg); font-size: 1rem; font-weight: 800; margin-bottom: 10px; text-align: center; }
    .payment-method {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
      background: white; padding: 8px 12px; border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .payment-method img { width: 25px; height: 25px; object-fit: contain; }
    .payment-method span { font-size: 0.9rem; font-weight: 700; color: #2d3436; }
    .btn-whatsapp {
      background: #25D366; color: white; display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%; padding: 12px; border-radius: 12px; text-decoration: none;
      font-weight: 700; margin-top: 10px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); transition: 0.3s;
    }
    .btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); }

    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(30, 39, 46, 0.95); color: white; padding: 15px 30px;
      border-radius: 50px; z-index: 1100; font-size: 0.95rem; font-weight: 600;
      border: 1px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: toastUp 0.4s ease forwards;
    }
    @keyframes toastUp { from { bottom: -50px; opacity: 0; } to { bottom: 30px; opacity: 1; } }

    .section-title { color: white; text-align: center; margin-bottom: 25px; font-size: 1.4rem; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    
    /* Chemistry Reaction Animation */
    .reaction-particle {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 2000;
      animation: explode 1s ease-out forwards;
    }
    @keyframes explode { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(3) translate(var(--tx), var(--ty)); opacity: 0; } }
  </style>
</head>
<body>

<!-- خلفية التفاعل الكيميائي -->
<div class="bubbles" id="bubblesContainer"></div>

<header>
  <h1><i class="fas fa-flask"></i> أ/ محمد أيمن</h1>
  <p class="slogan"><i class="fas fa-atom"></i> خبير مادة الكيمياء | منصة التعلم الذكي</p>
</header>

<div id="mainMenu" class="container">
  <div class="card" onclick="openStage('prep')">
    <i class="fas fa-vial"></i> المرحلة الإعدادية
  </div>
  <div class="card" onclick="openStage('sec')">
    <i class="fas fa-microscope"></i> المرحلة الثانوية
  </div>
</div>

<div id="stageMenu" class="container" style="display:none;">
  <h2 class="section-title" id="stageTitle"></h2>
  <div id="classList" style="display: flex; flex-direction: column; gap: 10px;"></div>
  <button class="btn back-btn" onclick="goBack()"><i class="fas fa-arrow-right"></i> العودة للمعمل</button>
</div>

<div id="detailsMenu" class="container" style="display:none;">
  <h2 class="section-title" id="classTitle"></h2>
  <div id="detailsCards"></div>
  <button class="btn back-btn" onclick="goBack()"><i class="fas fa-arrow-right"></i> رجوع للخلف</button>
</div>

<div id="passwordModal" class="modal-overlay">
  <div class="modal-container">
    <!-- قسم إدخال الكود -->
    <i class="fas fa-fingerprint" style="font-size: 2.5rem; color: var(--primary); text-shadow: 0 0 10px var(--primary);"></i>
    <h3 style="margin: 10px 0 5px;">مصادقة كيميائية</h3>
    <p id="sessionName" style="color: #636e72; font-size: 0.95rem; font-weight: 600;"></p>
    
    <input type="password" id="passwordInput" class="password-input" placeholder="••••••" maxlength="6" inputmode="numeric">
    
    <div style="display: flex; justify-content: space-between; gap: 10px;">
      <button class="btn btn-primary" id="verifyBtn" onclick="verifyPassword()" style="flex: 2;"><i class="fas fa-bolt"></i> تفعيل</button>
      <button class="btn btn-danger" onclick="closePasswordModal()" style="flex: 1;">إلغاء</button>
    </div>

    <!-- فاصل جمالي -->
    <hr style="border: 0; border-top: 1px dashed #b2bec3; margin: 20px 0;">

    <!-- قسم الدفع وشراء الكود -->
    <h4 class="payment-title"><i class="fas fa-shopping-cart"></i> لا تملك كود التفاعل؟</h4>
    <div class="payment-section">
      <p style="font-size: 0.85rem; color: #636e72; margin-bottom: 12px; text-align: center;">
        للحصول على الكود، قم بتحويل <strong>50 ج.م</strong> عبر الطرق التالية:
      </p>
      
      <!-- طريقة فودافون كاش (محدثة برقمك) -->
      <div class="payment-method">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Vodafone_logo.svg/1024px-Vodafone_logo.svg.png" alt="Vodafone">
        <span>فودافون كاش: 01098264848</span>
      </div>
      
      <!-- طريقة إنستاباي -->
      <div class="payment-method">
        <img src="https://play-lh.googleusercontent.com/1-11vB0bE-2A42rN0xV8FzXp3ZlK65qI0x1hN7YtF_Bv3Q8T_j8T_5n8Q0D_Q8D_Q8D_=w240-h480-rw" alt="InstaPay" style="border-radius: 5px;">
        <span>إنستاباي: mr.ayman@instapay</span>
      </div>

      <!-- زر الواتساب (محدث برقمك 01098264848) -->
      <a href="https://wa.me/201098264848?text=أهلاً،%20قمت%20بتحويل%20مبلغ%20الحصة%20وأريد%20استلام%20الكود" target="_blank" class="btn-whatsapp">
        <i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> أرسل الإيصال لاستلام الكود
      </a>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // إعدادات الواجهة الخلفية (Backend Configuration)
  // ضع هنا رابط Google Apps Script بعد نشره.
  // في وضع التطوير المحلي، سيقوم التطبيق تلقائياً بالتحويل إلى السيرفر المحلي.
  // =========================================================================
  const API_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; 
  
  // الكشف الديناميكي عن بيئة التشغيل للاتصال بالـ API المناسب
  const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '';
  const apiEndpoint = (isLocalhost && API_URL.includes("YOUR_SCRIPT_ID")) ? `${window.location.origin}/api/verify` : API_URL;
  // =========================================================================

  // إنشاء الفقاعات الكيميائية
  const bubblesContainer = document.getElementById('bubblesContainer');
  for (let i = 0; i < 15; i++) {
    let bubble = document.createElement('div');
    bubble.className = 'bubble';
    let size = Math.random() * 40 + 10;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.animationDuration = (Math.random() * 8 + 4) + 's';
    bubble.style.animationDelay = (Math.random() * 5) + 's';
    bubblesContainer.appendChild(bubble);
  }

  let unlockedSessions = JSON.parse(localStorage.getItem('unlockedData') || '{}');
  let historyStack = [];
  let pendingData = null;

  function saveUnlocked() { localStorage.setItem('unlockedData', JSON.stringify(unlockedSessions)); }

  function showToast(msg, isError = false) {
    const existingToast = document.querySelector('.toast');
    if (existingToast) existingToast.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = msg;
    toast.style.borderColor = isError ? '#ff7675' : '#00cec9';
    toast.style.boxShadow = isError ? '0 5px 15px rgba(255,118,117,0.3)' : '0 5px 15px rgba(0,206,201,0.3)';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  function chemistryReaction() {
    const colors = ['#00cec9', '#81ecec', '#00b894', '#55efc4'];
    for(let i = 0; i < 40; i++) {
      const particle = document.createElement('div');
      particle.className = 'reaction-particle';
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      particle.style.width = (Math.random() * 10 + 5) + 'px';
      particle.style.height = particle.style.width;
      particle.style.left = '50%'; particle.style.top = '50%';
      particle.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
      particle.style.setProperty('--ty', (Math.random() * 200 - 100) + 'px');
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 1000);
    }
  }

  function openStage(stage) {
    historyStack = ['mainMenu'];
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('stageMenu').style.display = 'block';
    document.getElementById('detailsMenu').style.display = 'none';
    
    const title = stage === 'prep' ? '<i class="fas fa-vial"></i> المرحلة الإعدادية' : '<i class="fas fa-microscope"></i> المرحلة الثانوية';
    document.getElementById('stageTitle').innerHTML = title;
    
    const classes = stage === 'prep' ? ["الأول الإعدادي","الثاني الإعدادي","الثالث الإعدادي"] : ["الأول الثانوي","الثاني الثانوي","الثالث الثانوي"];
    const container = document.getElementById('classList');
    container.innerHTML = '';
    
    classes.forEach(className => {
      let unlockedCount = 0;
      for(let i = 1; i <= 10; i++) { if(unlockedSessions[`${className}-${i}`]) unlockedCount++; }
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <i class="fas fa-dna" style="color: var(--primary);"></i> ${className}<br>
        <small style="color: #636e72; font-size: 0.9rem;">🧪 ${unlockedCount}/10 تفاعلات تمت</small>
        <div class="progress-bar"><div class="progress-fill" style="width: ${unlockedCount * 10}%"></div></div>
      `;
      card.onclick = () => openClassDetails(className);
      container.appendChild(card);
    });
  }

  function openClassDetails(className) {
    historyStack.push('stageMenu');
    document.getElementById('stageMenu').style.display = 'none';
    document.getElementById('detailsMenu').style.display = 'block';
    document.getElementById('classTitle').innerHTML = `<i class="fas fa-flask"></i> ${className}`;
    
    const container = document.getElementById('detailsCards');
    container.innerHTML = '';
    
    for(let i = 1; i <= 10; i++) {
      const key = `${className}-${i}`;
      const sessionData = unlockedSessions[key];
      const isUnlocked = !!sessionData;
      
      const card = document.createElement('div');
      card.className = `session-card ${isUnlocked ? 'unlocked' : 'locked'}`;
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
          <h3 style="font-size: 1.1rem; color: var(--dark-bg);"><i class="fas fa-vials"></i> التفاعل رقم ${i}</h3>
          ${isUnlocked ? '<span style="color: var(--success); font-size: 0.9rem;"><i class="fas fa-unlock-alt"></i> نشط</span>' : '<span style="color: #b2bec3; font-size: 0.9rem;"><i class="fas fa-lock"></i> خامل</span>'}
        </div>
        <div class="action-buttons">
          <button class="action-btn video" data-session="${i}" data-type="video"><i class="fas fa-play-circle"></i> الشرح</button>
          <button class="action-btn homework" data-session="${i}" data-type="homework"><i class="fas fa-file-pdf"></i> التدريب</button>
          <button class="action-btn test" data-session="${i}" data-type="test"><i class="fas fa-stopwatch"></i> الاختبار</button>
        </div>
      `;
      
      container.appendChild(card);
      card.querySelectorAll('.action-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const session = parseInt(btn.dataset.session);
          const type = btn.dataset.type;
          
          if(!unlockedSessions[`${className}-${session}`]) {
            pendingData = { className, session, type };
            showPasswordModal(session);
          } else {
            openContent(unlockedSessions[`${className}-${session}`], type, session);
          }
        };
      });
    }
  }

  function showPasswordModal(sessionNum) {
    document.getElementById('sessionName').innerHTML = `التفاعل رقم ${sessionNum}<br><small style="color: var(--danger);"><i class="fas fa-shield-alt"></i> يتطلب طاقة التنشيط (الكود)</small>`;
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordModal').style.display = 'flex';
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
  }

  async function verifyPassword() {
    const entered = document.getElementById('passwordInput').value;
    if (!entered) { showToast('⚠️ يرجى إدخال الكود أولاً', true); return; }

    const { className, session, type } = pendingData;
    const btn = document.getElementById('verifyBtn');
    
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحليل...';
    btn.disabled = true;

    try {
      // الاتصال بالخادم (سواء المحلي أو Apps Script)
      const response = await fetch(apiEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify({ className: className, session: session, code: entered })
      });

      const result = await response.json();

      if (result.success) {
        const key = `${className}-${session}`;
        unlockedSessions[key] = result.data; 
        saveUnlocked();
        
        closePasswordModal();
        chemistryReaction();
        historyStack.pop(); 
        openClassDetails(className); 
        openContent(result.data, type, session);
        showToast('✅ اكتمل التفاعل بنجاح!');
      } else {
        triggerError();
      }
    } catch (error) {
      console.error("API Connection Error:", error);
      // ===== كود المحاكاة الاحتياطي (يعمل فقط في حال انقطاع السيرفر تماماً) =====
      console.log("تم تفعيل وضع المحاكاة الاحتياطي...");
      setTimeout(() => {
          if (entered === "123456") { 
              const mockData = { video: "https://youtube.com", homework: "https://drive.google.com", test: "https://docs.google.com" };
              unlockedSessions[`${className}-${session}`] = mockData;
              saveUnlocked(); closePasswordModal(); chemistryReaction(); historyStack.pop();
              openClassDetails(className); openContent(mockData, type, session);
              showToast('✅ اكتمل التفاعل بنجاح! (محاكاة)');
          } else {
              triggerError();
          }
          btn.innerHTML = originalText; btn.disabled = false;
      }, 1000);
      // =================================================================
    } finally {
      if (apiEndpoint !== "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec") {
          btn.innerHTML = originalText; btn.disabled = false;
      }
    }
  }

  function triggerError() {
      showToast('❌ كود غير صالح! التفاعل فشل', true);
      const input = document.getElementById('passwordInput');
      input.value = ''; input.focus();
      const modal = document.querySelector('.modal-container');
      modal.style.animation = 'none';
      setTimeout(() => modal.style.animation = 'modalPop 0.3s ease', 10);
      navigator.vibrate && navigator.vibrate([100, 50, 100]);
  }

  function openContent(data, type, session) {
    let url = data[type];
    let name = type === 'video' ? 'الشرح' : (type === 'homework' ? 'التدريب' : 'الاختبار');
    if(url && url.trim() !== '') {
      window.open(url, '_blank'); showToast(`🧪 جاري فتح ${name} للتفاعل ${session}`);
    } else { showToast(`📢 ${name} الخاص بهذا التفاعل قيد التحضير في المعمل`, true); }
  }

  function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; pendingData = null; }

  function goBack() {
    if(historyStack.length === 0) return;
    const prev = historyStack.pop();
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('stageMenu').style.display = 'none';
    document.getElementById('detailsMenu').style.display = 'none';
    document.getElementById(prev).style.display = 'block';
  }

  document.getElementById('passwordInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') verifyPassword(); });

  document.getElementById('passwordModal').onclick = (e) => { if(e.target === document.getElementById('passwordModal')) closePasswordModal(); };
</script>

</body>
</html>
