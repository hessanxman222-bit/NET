<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr Mohamed Ayman | منصة الكيمياء</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ================= التصميم الأساسي (خفيف وسريع) ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --primary: #00cec9;
      --primary-dark: #00b894;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #2d3436;
      --success: #00b894;
      --danger: #ff7675;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding-bottom: 30px;
    }

    /* الهيدر السريع */
    header {
      background: linear-gradient(135deg, #1e272e, #2f3640);
      color: white;
      padding: 30px 15px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    header h1 { font-size: 1.6rem; color: var(--primary); }
    header p { font-size: 0.9rem; color: #dcdde1; margin-top: 5px; }

    /* الحاويات والكروت */
    .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
    
    .card {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #eee;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); background-color: #fdfdfd; }
    
    .session-card {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #eee;
      border-right: 4px solid #b2bec3;
    }
    .session-card.unlocked { border-right-color: var(--success); }

    /* الأزرار الخفيفة */
    .action-buttons { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .action-btn {
      flex: 1; padding: 10px 5px; border: none; border-radius: 10px;
      font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.85rem;
      color: white; cursor: pointer; text-align: center;
    }
    .btn-video { background-color: #ff7675; }
    .btn-homework { background-color: #74b9ff; }
    .btn-test { background-color: #55efc4; color: #2d3436; }
    .action-btn:active { opacity: 0.8; }

    .btn-main {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: var(--primary); color: white; font-size: 1rem; font-weight: 700;
      font-family: 'Cairo', sans-serif; cursor: pointer; margin-top: 10px;
    }

    .back-btn {
      background: #dfe6e9; color: #2d3436; margin-top: 20px;
    }

    /* النافذة المنبثقة (Modal) المبسطة */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-container {
      background: white; border-radius: 20px; padding: 25px 20px;
      width: 90%; max-width: 350px; text-align: center;
    }
    .password-input {
      width: 100%; padding: 15px; font-size: 1.5rem; text-align: center;
      border: 2px solid #dfe6e9; border-radius: 12px; margin: 15px 0;
      font-family: monospace; letter-spacing: 5px; direction: ltr;
    }
    .password-input:focus { border-color: var(--primary); outline: none; }

    /* الإشعارات السريعة */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #2d3436; color: white; padding: 12px 25px;
      border-radius: 30px; font-size: 0.9rem; font-weight: bold;
      z-index: 2000; display: none; white-space: nowrap;
    }
    
    .section-title { text-align: center; margin-bottom: 20px; color: var(--text-dark); }
  </style>
</head>
<body>

<header>
  <h1><i class="fas fa-flask"></i> أ/ محمد أيمن</h1>
  <p>منصة الكيمياء الذكية والمبسطة</p>
</header>

<!-- القائمة الرئيسية -->
<div id="mainMenu" class="container">
  <div class="card" onclick="openStage('prep')"><i class="fas fa-vial" style="color: var(--primary);"></i> المرحلة الإعدادية</div>
  <div class="card" onclick="openStage('sec')"><i class="fas fa-microscope" style="color: var(--primary);"></i> المرحلة الثانوية</div>
</div>

<!-- قائمة الصفوف -->
<div id="stageMenu" class="container" style="display:none;">
  <h3 class="section-title" id="stageTitle"></h3>
  <div id="classList"></div>
  <button class="btn-main back-btn" onclick="goBack()">العودة للرئيسية</button>
</div>

<!-- تفاصيل الحصص -->
<div id="detailsMenu" class="container" style="display:none;">
  <h3 class="section-title" id="classTitle"></h3>
  <div id="detailsCards"></div>
  <button class="btn-main back-btn" onclick="goBack()">رجوع للخلف</button>
</div>

<!-- نافذة إدخال الكود -->
<div id="passwordModal" class="modal-overlay">
  <div class="modal-container">
    <h3 style="color: var(--primary); margin-bottom: 5px;">تفعيل الحصة</h3>
    <p id="sessionName" style="color: #636e72; font-size: 0.9rem;"></p>
    
    <input type="tel" id="passwordInput" class="password-input" placeholder="••••••" maxlength="6">
    
    <div style="display: flex; gap: 10px;">
      <button class="btn-main" onclick="verifyPassword()" style="flex: 2;">تفعيل الآن</button>
      <button class="btn-main" onclick="closeModal()" style="background: var(--danger); flex: 1;">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // =========================================================================
  // 💡 DATABASE (قاعدة البيانات المحلية - هنا تضع أكوادك وروابطك!)
  // =========================================================================
  
  // الكود السحري: هذا الكود يعمل على أي حصة لتسهيل التجربة لك (يمكنك تغييره أو مسحه)
  const MASTER_CODE = "123456"; 

  // قاعدة بيانات الحصص (قم بتعديل الأكواد والروابط كما تشاء)
  const classDatabase = {
    // مثال لـ الصف الأول الإعدادي - الحصة 1
    "الأول الإعدادي-1": { 
      code: "111111", // الكود الخاص بهذه الحصة فقط
      video: "https://youtube.com", // رابط الشرح
      homework: "https://drive.google.com", // رابط الواجب
      test: "https://docs.google.com/forms" // رابط الامتحان
    },
    // مثال لـ الصف الأول الثانوي - الحصة 1
    "الأول الثانوي-1": { 
      code: "222222", 
      video: "https://youtube.com", 
      homework: "", // اتركها فارغة إذا لم يكن هناك رابط جاهز
      test: "" 
    }
    // يمكنك إضافة المزيد بنفس الطريقة...
  };

  // =========================================================================

  let unlockedSessions = JSON.parse(localStorage.getItem('unlockedData') || '{}');
  let historyStack = ['mainMenu'];
  let currentPending = null;

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.background = isError ? '#ff7675' : '#00b894';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }

  function switchView(viewId) {
    ['mainMenu', 'stageMenu', 'detailsMenu'].forEach(id => {
      document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
    });
  }

  function openStage(stage) {
    const title = stage === 'prep' ? 'المرحلة الإعدادية' : 'المرحلة الثانوية';
    document.getElementById('stageTitle').innerText = title;
    
    const classes = stage === 'prep' ? ["الأول الإعدادي","الثاني الإعدادي","الثالث الإعدادي"] : ["الأول الثانوي","الثاني الثانوي","الثالث الثانوي"];
    const container = document.getElementById('classList');
    container.innerHTML = '';
    
    classes.forEach(className => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerText = className;
      card.onclick = () => { historyStack.push('stageMenu'); openClassDetails(className); };
      container.appendChild(card);
    });
    
    switchView('stageMenu');
  }

  function openClassDetails(className) {
    document.getElementById('classTitle').innerText = className;
    const container = document.getElementById('detailsCards');
    container.innerHTML = '';
    
    for(let i = 1; i <= 10; i++) {
      const key = `${className}-${i}`;
      const isUnlocked = !!unlockedSessions[key];
      
      const card = document.createElement('div');
      card.className = `session-card ${isUnlocked ? 'unlocked' : ''}`;
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px;">
          <span>الحصة رقم ${i}</span>
          <span>${isUnlocked ? '🟢 مفعلة' : '🔴 مغلقة'}</span>
        </div>
        <div class="action-buttons">
          <button class="action-btn btn-video" onclick="handleAction('${className}', ${i}, 'video')"><i class="fas fa-play"></i> الشرح</button>
          <button class="action-btn btn-homework" onclick="handleAction('${className}', ${i}, 'homework')"><i class="fas fa-file-pdf"></i> التدريب</button>
          <button class="action-btn btn-test" onclick="handleAction('${className}', ${i}, 'test')"><i class="fas fa-pen"></i> الاختبار</button>
        </div>
      `;
      container.appendChild(card);
    }
    switchView('detailsMenu');
  }

  function handleAction(className, sessionNum, type) {
    const key = `${className}-${sessionNum}`;
    if (unlockedSessions[key]) {
      // الحصة مفعلة، قم بفتح الرابط
      openLink(className, sessionNum, type);
    } else {
      // الحصة غير مفعلة، اطلب الكود
      currentPending = { className, sessionNum, type };
      document.getElementById('sessionName').innerText = `${className} - الحصة ${sessionNum}`;
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordModal').style.display = 'flex';
    }
  }

  function verifyPassword() {
    const inputCode = document.getElementById('passwordInput').value;
    if (!inputCode) return showToast('أدخل الكود أولاً', true);

    const { className, sessionNum, type } = currentPending;
    const key = `${className}-${sessionNum}`;
    
    // البحث عن الكود في قاعدة البيانات التي أنشأناها بالأعلى
    const sessionData = classDatabase[key];
    const correctCodeForThisSession = sessionData ? sessionData.code : null;

    // التحقق: هل هو الكود السحري أم كود الحصة الصحيح؟
    if (inputCode === MASTER_CODE || inputCode === correctCodeForThisSession) {
      unlockedSessions[key] = true; // حفظ التفعيل
      localStorage.setItem('unlockedData', JSON.stringify(unlockedSessions));
      
      closeModal();
      showToast('تم التفعيل بنجاح!');
      openClassDetails(className); // تحديث شكل القائمة
      openLink(className, sessionNum, type); // فتح الرابط فوراً
    } else {
      showToast('الكود غير صحيح!', true);
    }
  }

  function openLink(className, sessionNum, type) {
    const key = `${className}-${sessionNum}`;
    const sessionData = classDatabase[key];
    
    if (sessionData && sessionData[type]) {
      window.open(sessionData[type], '_blank');
    } else {
      showToast('الرابط غير متوفر حالياً، سيتم إضافته قريباً', true);
    }
  }

  function closeModal() {
    document.getElementById('passwordModal').style.display = 'none';
  }

  function goBack() {
    const prev = historyStack.pop() || 'mainMenu';
    switchView(prev);
  }
</script>
</body>
</html>
